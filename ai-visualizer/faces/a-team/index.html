<!DOCTYPE html>
<!--
A-Team Command face for ai-visualizer.
Built as a standalone procedural canvas face driven by ai-visualizer/core.js.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A-Team Command</title>
<style>
  :root{
    --red:#ff304f;
    --redHot:#ff8091;
    --redDim:#762231;
    --ink:#edf1f2;
    --dim:#657078;
    --green:#55e39a;
    --black:#020304;
    --panel:rgba(7,9,11,.72);
    --mono:"SF Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:var(--black);overflow:hidden;cursor:none}
  body{font-family:var(--mono);color:var(--ink)}
  canvas#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .hud{position:fixed;inset:0;z-index:10;pointer-events:none;transition:opacity .5s}
  body.cine .hud{opacity:0}

  /* Tactical frame */
  .frame{position:absolute;inset:22px;border:1px solid rgba(255,48,79,.18)}
  .frame:before,.frame:after{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.035)}
  .corner{position:absolute;width:42px;height:42px;border-color:var(--red);opacity:.7}
  .tl{top:-1px;left:-1px;border-left:2px solid;border-top:2px solid}
  .tr{top:-1px;right:-1px;border-right:2px solid;border-top:2px solid}
  .bl{bottom:-1px;left:-1px;border-left:2px solid;border-bottom:2px solid}
  .br{bottom:-1px;right:-1px;border-right:2px solid;border-bottom:2px solid}

  #brand{position:absolute;top:44px;left:58px}
  #brand .a{
    font-size:clamp(42px,5vw,86px);font-weight:900;line-height:.78;
    color:var(--red);letter-spacing:-.12em;text-shadow:0 0 22px rgba(255,48,79,.28);
    display:inline-block;transform:skew(-9deg);
  }
  #brand .name{
    display:inline-block;margin-left:14px;vertical-align:top;
    font-size:clamp(18px,1.5vw,30px);font-weight:700;letter-spacing:.35em;
  }
  #brand .sub{margin-top:9px;font-size:clamp(8px,.62vw,12px);letter-spacing:.28em;color:var(--dim)}
  #brand .sub b{color:var(--red);font-weight:normal}

  #status{position:absolute;top:46px;right:58px;text-align:right}
  #mode{font-size:clamp(14px,1vw,20px);letter-spacing:.48em}
  #mode .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-left:10px;box-shadow:0 0 14px var(--red)}
  #clock{margin-top:8px;color:#a9b2b6;font-size:clamp(10px,.7vw,14px);letter-spacing:.24em}
  #mission{margin-top:14px;color:var(--redHot);font-size:clamp(8px,.58vw,11px);letter-spacing:.22em}
  #mission span{color:var(--dim)}

  #leftReadout,#rightReadout{
    position:absolute;top:34%;width:190px;font-size:clamp(8px,.55vw,11px);
    letter-spacing:.18em;color:var(--dim);line-height:2.1;
  }
  #leftReadout{left:58px}
  #rightReadout{right:58px;text-align:right}
  .v{color:#cbd1d3}.hot{color:var(--redHot)}.ok{color:var(--green)}

  #echo{
    position:absolute;left:58px;bottom:76px;font-size:clamp(10px,.7vw,14px);
    letter-spacing:.16em;color:#d9dddf;text-shadow:0 0 12px rgba(255,48,79,.2)
  }
  #echo .cur{display:inline-block;width:.55em;height:1em;background:var(--red);vertical-align:-12%;animation:blink .8s steps(2,start) infinite}
  @keyframes blink{50%{opacity:.15}}

  #bottom{position:absolute;left:58px;right:58px;bottom:36px;display:flex;justify-content:space-between;
    color:var(--dim);font-size:clamp(8px,.58vw,11px);letter-spacing:.25em}
  #bottom .hot{color:var(--redHot)}
  #hint .proc{display:none;color:var(--redHot)}

  #cross{
    position:absolute;left:50%;top:50%;width:170px;height:170px;transform:translate(-50%,-50%);
    opacity:.32
  }
  #cross:before,#cross:after{content:"";position:absolute;background:rgba(255,48,79,.38)}
  #cross:before{left:50%;top:0;width:1px;height:100%}
  #cross:after{left:0;top:50%;width:100%;height:1px}
  .ring{position:absolute;border:1px solid rgba(255,48,79,.34);border-radius:50%;inset:12%}
  .ring.r2{inset:29%;border-style:dashed;animation:spin 12s linear infinite}
  .ring.r3{inset:43%;border-color:rgba(255,255,255,.16)}
  @keyframes spin{to{transform:rotate(360deg)}}

  #vig{position:fixed;inset:0;pointer-events:none;z-index:8;
    background:radial-gradient(ellipse at 50% 48%,transparent 43%,rgba(0,0,0,.72) 100%)}
  #scan{position:fixed;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 4px);
    mix-blend-mode:screen;opacity:.7}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vig"></div><div id="scan"></div>

<div class="hud">
  <div class="frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>

  <div id="brand">
    <span class="a">A</span><span class="name">TEAM AI</span>
    <div class="sub">TACTICAL INTELLIGENCE NETWORK — <b>ONLINE</b></div>
  </div>

  <div id="status">
    <div id="mode">IDLE <span class="dot"></span></div>
    <div id="clock">00:00:00</div>
    <div id="mission">SYSTEM STATUS <span>// NOMINAL</span></div>
  </div>

  <div id="leftReadout">
    <div>CORE <span class="v" id="core">STANDBY</span></div>
    <div>LINK <span class="ok">SECURE</span></div>
    <div>LATENCY <span class="v" id="lat">-- MS</span></div>
    <div>POWER <span class="hot" id="power">025%</span></div>
  </div>

  <div id="rightReadout">
    <div>VECTOR <span class="v" id="vector">000.00</span></div>
    <div>THREAT <span class="ok">NONE</span></div>
    <div>CHANNEL <span class="v">A-01</span></div>
    <div>UPTIME <span class="v">LOCAL</span></div>
  </div>

  <div id="cross"><i class="ring"></i><i class="ring r2"></i><i class="ring r3"></i></div>
  <div id="echo"></div>

  <div id="bottom">
    <div>COMMAND BUS — <span class="hot">ACTIVE</span></div>
    <div id="hint"><span class="idlehint">SPACE / C — TACTICAL FLYTHROUGH</span><span class="proc">PROCESSING TARGET...</span></div>
  </div>
</div>

<script src="../../core.js"></script>
<script>
"use strict";

/*
  A-TEAM COMMAND
  ----------------
  Procedural tactical HUD:
    - dark military/industrial command aesthetic
    - large animated A-Team energy core
    - radial targeting system
    - orbiting telemetry nodes
    - red signal packets
    - state-reactive visuals
    - Space/C = cinematic flythrough
    - F = fullscreen
    - ?fps=1 = FPS meter
    - ?demo=1 is handled by core.js
*/

const Q=new URLSearchParams(location.search);
const SHOT=Q.get("shot");
let seed=parseInt(Q.get("seed")||"41",10);

function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296
  }
}
const rnd=mulberry32(seed);
const R=(a,b)=>a+rnd()*(b-a);
const $=id=>document.getElementById(id);

AV.init({});
AV.ready(a=>{
  document.title=a.label+" — A-Team Command";
  // Keep the A-TEAM identity as the visual brand; expose the actual agent name in telemetry.
  $("core").textContent=a.label.toUpperCase();
});

const cv=$("stage"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,now=0;
let nodes=[],links=[],packets=[],stars=[];
let energy=.25,level=0;
let statePrev="idle",cine=null,cam={x:0,y:0,z:1};
let bg=null;

/* ---------- helpers ---------- */
function hex(n){return n.toString(16).padStart(2,"0")}
function rgba(r,g,b,a){return`rgba(${r},${g},${b},${a})`}
function stateColor(){
  if(AV.state==="listening")return [70,184,255];
  if(AV.state==="speaking")return [255,48,79];
  if(AV.state==="thinking")return [255,154,64];
  return [255,48,79];
}
function ease(current,target,tau,dt){
  return current+(target-current)*(1-Math.exp(-dt/tau));
}
function targetEnergy(){
  if(AV.state==="thinking")return 1;
  if(AV.state==="speaking")return .5+.5*Math.pow(Math.max(0,AV.level),.7);
  if(AV.state==="listening")return .5;
  return .25;
}

/* ---------- tactical network ---------- */
function build(){
  nodes=[];links=[];packets=[];stars=[];
  const cx=W/2,cy=H/2;
  const N=42;
  for(let i=0;i<N;i++){
    const a=R(0,Math.PI*2),rad=Math.min(W,H)*R(.16,.43);
    nodes.push({
      x:cx+Math.cos(a)*rad,y:cy+Math.sin(a)*rad,
      r:R(2,6),phase:R(0,Math.PI*2),hot:R(0,1),
      sector:i%8
    });
  }

  // Connect nearby nodes into a sparse command network.
  for(let i=0;i<nodes.length;i++){
    const candidates=[];
    for(let j=0;j<nodes.length;j++)if(i!==j){
      const d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);
      if(d<Math.min(W,H)*.18)candidates.push([d,j]);
    }
    candidates.sort((a,b)=>a[0]-b[0]);
    candidates.slice(0,2+(i%2)).forEach(([d,j])=>{
      if(!links.some(l=>(l.a===i&&l.b===j)||(l.a===j&&l.b===i)))
        links.push({a:i,b:j,phase:R(0,10),hot:0});
    });
  }

  for(let i=0;i<150;i++)stars.push({
    x:rnd()*W,y:rnd()*H,s:R(.25,1.6),a:R(.03,.22)
  });

  renderBackground();
}
function renderBackground(){
  bg=document.createElement("canvas");bg.width=W;bg.height=H;
  const g=bg.getContext("2d");
  g.fillStyle="#020304";g.fillRect(0,0,W,H);

  // industrial grid
  const step=Math.max(26,Math.round(Math.min(W,H)/28));
  g.strokeStyle="rgba(255,255,255,.025)";g.lineWidth=1;
  g.beginPath();
  for(let x=0;x<=W;x+=step){g.moveTo(x,0);g.lineTo(x,H)}
  for(let y=0;y<=H;y+=step){g.moveTo(0,y);g.lineTo(W,y)}
  g.stroke();

  // red tactical sector marks
  g.strokeStyle="rgba(255,48,79,.055)";
  for(let r=step*5;r<Math.max(W,H);r+=step*5){
    g.beginPath();g.arc(W/2,H/2,r,0,Math.PI*2);g.stroke();
  }

  stars.forEach(s=>{
    g.fillStyle=`rgba(210,220,225,${s.a})`;
    g.fillRect(s.x,s.y,s.s,s.s);
  });
}

/* ---------- cinematic camera ---------- */
function startCine(){
  if(cine)return;
  const cx=W/2,cy=H/2;
  const targets=[
    {x:cx+W*.20,y:cy-H*.12,z:2.25},
    {x:cx-W*.18,y:cy+H*.10,z:2.55},
    {x:cx+W*.10,y:cy+H*.20,z:2.8},
    {x:cx-W*.08,y:cy-H*.18,z:2.45},
    {x:cx,y:cy,z:1}
  ];
  const segs=[];
  let from={x:cx,y:cy,z:1};
  targets.forEach((to,i)=>{
    segs.push({f:from,t:to,d:i===targets.length-1?5200:4200+(rnd()*1300|0)});
    from=to;
  });
  cine={t:0,segs};
  document.body.classList.add("cine");
}
function endCine(){cine=null;cam={x:W/2,y:H/2,z:1};document.body.classList.remove("cine")}
function updateCine(dt){
  cine.t+=dt;
  let t=cine.t;
  for(const s of cine.segs){
    if(t<=s.d){
      const p=t/s.d,e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      cam={
        x:s.f.x+(s.t.x-s.f.x)*e,
        y:s.f.y+(s.t.y-s.f.y)*e,
        z:s.f.z+(s.t.z-s.f.z)*e
      };
      return;
    }
    t-=s.d;
  }
  endCine();
}

/* ---------- HUD ---------- */
function syncHUD(){
  const s=AV.state;
  $("mode").innerHTML=(s==="thinking"?"THINKING":s==="speaking"?"SPEAKING":s==="listening"?"LISTENING":"IDLE")
    +' <span class="dot"></span>';
  $("mission").innerHTML=s==="thinking"?"SYSTEM STATUS <span>// COMPUTING</span>"
    :s==="speaking"?"SYSTEM STATUS <span>// TRANSMITTING</span>"
    :s==="listening"?"SYSTEM STATUS <span>// RECEIVING</span>"
    :"SYSTEM STATUS <span>// NOMINAL</span>";
  $("hint").querySelector(".proc").style.display=s==="thinking"?"inline":"none";
  $("hint").querySelector(".idlehint").style.display=s==="thinking"?"none":"inline";
}

/* ---------- draw ---------- */
function drawCore(g,dt){
  const cx=W/2,cy=H/2;
  const [cr,cg,cb]=stateColor();
  const pulse=1+.035*Math.sin(now/500)+.06*energy+.05*level;
  const base=Math.min(W,H)*.105*pulse;

  // Outer glow
  const glow=g.createRadialGradient(cx,cy,0,cx,cy,base*2.8);
  glow.addColorStop(0,rgba(cr,cg,cb,.20+.20*energy));
  glow.addColorStop(.35,rgba(cr,cg,cb,.08+.10*energy));
  glow.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=glow;g.fillRect(cx-base*3,cy-base*3,base*6,base*6);

  // Rotating targeting rings
  g.save();g.translate(cx,cy);
  for(let k=0;k<4;k++){
    const rr=base*(1.0+k*.32);
    g.save();g.rotate(now*(.00012+k*.00007)*(k%2?-1:1));
    g.strokeStyle=rgba(cr,cg,cb,.22-k*.035);
    g.lineWidth=k===0?2:1;
    g.setLineDash(k===1?[8,13]:k===3?[2,18]:[]);
    g.beginPath();
    g.arc(0,0,rr,-Math.PI*.78,Math.PI*.54);
    g.stroke();
    g.restore();
  }
  g.restore();

  // Main command core: octagonal tactical plate.
  const s=base*.72;
  g.save();g.translate(cx,cy);g.rotate(Math.sin(now/1800)*.018);
  g.beginPath();
  for(let i=0;i<8;i++){
    const a=Math.PI/8+i*Math.PI/4;
    const rr=i%2?s:s*.92;
    const x=Math.cos(a)*rr,y=Math.sin(a)*rr;
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.closePath();
  g.fillStyle="rgba(5,7,8,.96)";g.fill();
  g.strokeStyle=rgba(255,255,255,.16);g.lineWidth=2;g.stroke();
  g.strokeStyle=rgba(cr,cg,cb,.62);g.lineWidth=1;g.stroke();

  // A-Team A glyph.
  const fs=Math.round(s*.82);
  g.font=`900 ${fs}px ${getComputedStyle(document.body).fontFamily}`;
  g.textAlign="center";g.textBaseline="middle";
  g.fillStyle=rgba(cr,cg,cb,.95);
  g.shadowColor=rgba(cr,cg,cb,.9);g.shadowBlur=18+24*energy;
  g.fillText("A",0,3);
  g.shadowBlur=0;

  // inner status line
  g.font=`600 ${Math.max(8,Math.round(s*.10))}px ${getComputedStyle(document.body).fontFamily}`;
  g.letterSpacing="2px";
  g.fillStyle="rgba(235,240,242,.55)";
  g.fillText(AV.label.toUpperCase(),0,s*.73);

  // voice waveform around the core
  if(AV.state==="speaking"||AV.state==="listening"){
    g.strokeStyle=rgba(cr,cg,cb,.65);g.lineWidth=2;g.beginPath();
    for(let i=0;i<=80;i++){
      const a=Math.PI*2*i/80;
      const rr=base*(1.64+.10*Math.sin(a*9+now/100)+.08*level*Math.sin(a*17-now/70));
      const x=Math.cos(a)*rr,y=Math.sin(a)*rr;
      i?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.stroke();
  }
  g.restore();
}

function drawNetwork(g,dt){
  const [cr,cg,cb]=stateColor();

  links.forEach(l=>{
    const a=nodes[l.a],b=nodes[l.b];
    const dx=b.x-a.x,dy=b.y-a.y;
    const grad=g.createLinearGradient(a.x,a.y,b.x,b.y);
    grad.addColorStop(0,rgba(cr,cg,cb,.055+l.hot*.25));
    grad.addColorStop(.5,rgba(cr,cg,cb,.11+l.hot*.42));
    grad.addColorStop(1,rgba(cr,cg,cb,.055+l.hot*.25));
    g.strokeStyle=grad;g.lineWidth=1+l.hot*1.8;
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
    l.hot*=Math.exp(-dt/430);
  });

  nodes.forEach((n,i)=>{
    const beat=.5+.5*Math.sin(now/650+n.phase);
    const rr=n.r*(1+beat*.22*energy);
    const glow=g.createRadialGradient(n.x,n.y,0,n.x,n.y,rr*7);
    glow.addColorStop(0,rgba(cr,cg,cb,.20+n.hot*.3));
    glow.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=glow;g.fillRect(n.x-rr*7,n.y-rr*7,rr*14,rr*14);
    g.fillStyle=rgba(220,228,230,.5+n.hot*.4);
    g.beginPath();g.arc(n.x,n.y,rr,0,Math.PI*2);g.fill();
    n.hot*=Math.exp(-dt/500);
  });
}

function spawnPacket(){
  if(!links.length)return;
  const l=links[(rnd()*links.length)|0];
  packets.push({l,t:0,s:R(.00035,.00075),trail:R(.04,.11)});
}
function drawPackets(g,dt){
  const [cr,cg,cb]=stateColor();
  packets=packets.filter(p=>{
    p.t+=p.s*dt*(.65+4.5*energy);
    const a=nodes[p.l.a],b=nodes[p.l.b];
    if(p.t>=1){
      nodes[p.l.b].hot=1;
      p.l.hot=1;
      return false;
    }
    const x=a.x+(b.x-a.x)*p.t,y=a.y+(b.y-a.y)*p.t;
    const tail=Math.max(0,p.t-p.trail);
    const tx=a.x+(b.x-a.x)*tail,ty=a.y+(b.y-a.y)*tail;
    g.strokeStyle=rgba(cr,cg,cb,.8);g.lineWidth=1.5+2*energy;
    g.beginPath();g.moveTo(tx,ty);g.lineTo(x,y);g.stroke();
    g.fillStyle=rgba(255,235,238,.95);
    g.beginPath();g.arc(x,y,2.3+3*energy,0,Math.PI*2);g.fill();
    return true;
  });
}

function frame(dt){
  AV.tick(dt);now+=dt;
  if(AV.state!==statePrev){statePrev=AV.state;syncHUD()}

  energy=ease(energy,targetEnergy(),AV.state==="speaking"?130:520,dt);
  level=ease(level,AV.level,90,dt);

  const rate=.008+.09*energy;
  if(rnd()<rate)spawnPacket();
  if(AV.state==="thinking" && rnd()<.16)spawnPacket();

  $("clock").textContent=new Date().toLocaleTimeString([],{
    hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"
  });
  $("power").textContent=String(Math.round(energy*100)).padStart(3,"0")+"%";
  $("lat").textContent=Math.round(18+energy*67)+" MS";
  $("vector").textContent=(now/137)%360;
  $("vector").textContent=Number($("vector").textContent).toFixed(2);

  if(cine)updateCine(dt);
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(bg,0,0);

  ctx.save();
  if(cine){
    ctx.translate(W/2,H/2);ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);
  }

  // Large radial tactical atmosphere.
  const [cr,cg,cb]=stateColor();
  const atmosphere=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*.62);
  atmosphere.addColorStop(0,rgba(cr,cg,cb,.055+.07*energy));
  atmosphere.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=atmosphere;ctx.fillRect(0,0,W,H);

  drawNetwork(ctx,dt);
  drawPackets(ctx,dt);
  drawCore(ctx,dt);
  ctx.restore();

  // Tactical sweep.
  const sy=((now/5200)%1.25)-.12;
  const sweep=ctx.createLinearGradient(0,H*sy,0,H*(sy+.18));
  sweep.addColorStop(0,"rgba(255,48,79,0)");
  sweep.addColorStop(.5,rgba(255,48,79,.055+.05*energy));
  sweep.addColorStop(1,"rgba(255,48,79,0)");
  ctx.fillStyle=sweep;ctx.fillRect(0,0,W,H);

  // Random tiny telemetry ticks.
  ctx.strokeStyle="rgba(255,48,79,.15)";ctx.lineWidth=1;
  for(let i=0;i<12;i++){
    const x=(i*W/12+((now/90)%W))%W;
    const y=(i*83+37)%H;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+R(3,12),y);ctx.stroke();
  }
}

function resize(){
  if(cine)endCine();
  DPR=Math.min(devicePixelRatio||1,1.25);
  W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";
  build();cam={x:W/2,y:H/2,z:1};
  if(SHOT&&Q.get("cine")==="1")startCine();
}
addEventListener("resize",resize);
resize();

addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();cine?endCine():startCine()}
  if(e.key==="c"||e.key==="C"){cine?endCine():startCine()}
  if(e.key==="f"||e.key==="F"){
    document.fullscreenElement?document.exitFullscreen()
      :document.documentElement.requestFullscreen()
  }
});

let fpsEl=null,fa=0,fn=0;
if(Q.get("fps")==="1"){
  fpsEl=document.createElement("div");
  fpsEl.style.cssText="position:fixed;bottom:64px;right:58px;z-index:40;font:11px SF Mono,Menlo,monospace;letter-spacing:.2em;color:#657078";
  document.body.appendChild(fpsEl);
}

if(SHOT){
  if(Q.get("cine")==="1")startCine();
  AV.shotRun(frame);
}else{
  let last=performance.now();
  function loop(ts){
    const dt=Math.min(50,ts-last);last=ts;
    frame(dt);
    if(fpsEl){fa+=dt;fn++;if(fa>=500){fpsEl.textContent="FPS "+Math.round(1000/(fa/fn));fa=0;fn=0}}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
</script>
</body>
