<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - Local Fullstack Agent</title>
<style>
  :root {
    --bg: #030806;
    --card: #06140e;
    --card-border: #0e2b1d;
    --ink: #e6f4ed;
    --dim: #607b70;
    --green: #3ddc84;
    --cyan: #00f0ff;
    --amber: #e7c368;
    --red: #ff5252;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    height: 100vh;
    max-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Navigation Bar */
  header {
    height: 56px;
    flex-shrink: 0;
    background: rgba(4, 16, 11, 0.95);
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 100;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    letter-spacing: 0.25em;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 12px rgba(61, 220, 132, 0.4);
  }
  .status-pill {
    font-size: 10px;
    letter-spacing: 0.15em;
    padding: 3px 8px;
    border-radius: 12px;
    background: rgba(61, 220, 132, 0.12);
    border: 1px solid var(--green);
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .select-box {
    background: #04100a;
    border: 1px solid var(--card-border);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }
  .select-box:focus { border-color: var(--green); }

  .nav-tabs {
    display: flex;
    gap: 6px;
  }
  .tab-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active {
    background: rgba(61, 220, 132, 0.1);
    border-color: var(--green);
    color: var(--green);
  }

  /* Main Container */
  main {
    flex: 1;
    display: flex;
    height: calc(100vh - 56px);
    max-height: calc(100vh - 56px);
    min-height: 0;
    position: relative;
    overflow: hidden;
  }

  /* View: Dashboard (Visualizer + Chat) */
  #view-dashboard {
    flex: 1;
    display: flex;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
  }

  /* 3D Visualizer Face Viewport */
  .face-pane {
    flex: 1.1;
    background: #000;
    border-right: 1px solid var(--card-border);
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    overflow: hidden;
  }
  .face-frame {
    width: 100%;
    height: 100%;
    border: none;
  }
  .face-overlay {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: rgba(4, 16, 11, 0.85);
    border: 1px solid var(--card-border);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--dim);
    pointer-events: none;
  }
  .face-overlay b { color: var(--green); }

  /* Chat Terminal Pane */
  .chat-pane {
    flex: 0.9;
    display: flex;
    flex-direction: column;
    background: #020a06;
    height: 100%;
    min-height: 0;
    overflow: hidden;
  }
  .chat-header {
    flex-shrink: 0;
    padding: 10px 16px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--dim);
  }
  .chat-clear-btn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--dim);
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 3px;
    cursor: pointer;
  }
  .chat-clear-btn:hover { color: var(--amber); border-color: var(--amber); }

  .chat-messages {
    flex: 1 1 auto;
    overflow-y: auto;
    min-height: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 90%;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.6;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #0d281a;
    border: 1px solid #1a4a32;
    color: #e6fcf0;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #05140d;
    border: 1px solid var(--card-border);
    color: var(--ink);
  }
  .msg .speaker {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--dim);
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .msg.assistant .speaker { color: var(--green); }

  /* Tool execution card */
  .tool-card {
    align-self: stretch;
    background: rgba(0, 240, 255, 0.05);
    border: 1px dashed var(--cyan);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 11px;
    margin: 4px 0;
  }
  .tool-card .t-head {
    color: var(--cyan);
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }
  .tool-card .t-body {
    background: rgba(0,0,0,0.5);
    padding: 8px;
    border-radius: 4px;
    white-space: pre-wrap;
    max-height: 140px;
    overflow-y: auto;
    color: #a0d8e8;
  }

  /* Chat Input Area */
  .chat-input-box {
    flex-shrink: 0;
    padding: 12px 16px;
    border-top: 1px solid var(--card-border);
    background: #030d08;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea#user-input {
    flex: 1;
    background: #020705;
    border: 1px solid var(--card-border);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
    outline: none;
    resize: none;
    height: 44px;
    line-height: 1.4;
  }
  textarea#user-input:focus { border-color: var(--green); }

  .btn {
    background: #092417;
    border: 1px solid var(--green);
    color: var(--green);
    font-family: var(--mono);
    font-size: 12px;
    padding: 11px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover {
    background: var(--green);
    color: #000;
    box-shadow: 0 0 14px rgba(61, 220, 132, 0.4);
  }
  .btn.mic-btn {
    border-color: var(--dim);
    color: var(--dim);
  }
  .btn.mic-btn.active {
    border-color: var(--red);
    color: var(--red);
    background: rgba(255, 82, 82, 0.1);
    animation: pulse 1s infinite;
  }

  /* View: Memory Vault */
  #view-vault, #view-settings {
    flex: 1;
    padding: 28px 40px;
    overflow-y: auto;
    display: none;
    background: #020805;
  }
  .vault-layout {
    display: flex;
    gap: 24px;
    height: 100%;
  }
  .vault-sidebar {
    width: 260px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #04100a;
  }
  .vault-file-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 12px;
    text-align: left;
    border-radius: 4px;
    cursor: pointer;
  }
  .vault-file-btn:hover { color: var(--ink); background: rgba(61, 220, 132, 0.05); }
  .vault-file-btn.active {
    color: var(--green);
    background: rgba(61, 220, 132, 0.12);
    border-color: var(--green);
  }
  .vault-editor {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #vault-text {
    flex: 1;
    background: #04100a;
    border: 1px solid var(--card-border);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    padding: 16px;
    border-radius: 8px;
    outline: none;
    resize: none;
    line-height: 1.6;
  }

  /* View: Settings */
  .settings-card {
    max-width: 600px;
    background: #04100a;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .settings-title {
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--green);
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 8px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--dim);
  }
  .form-input {
    background: #020705;
    border: 1px solid var(--card-border);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 4px;
    outline: none;
  }
  .form-input:focus { border-color: var(--green); }

  /* View: Bare Hands Air Board */
  #view-barehands {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 500;
    display: none;
    flex-direction: column;
  }
  .barehands-frame {
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
  }

  /* Floating Mode Switcher */
  .floating-mode-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999;
    display: none;
    align-items: center;
    gap: 10px;
    background: rgba(6, 20, 14, 0.88);
    backdrop-filter: blur(12px);
    border: 1.5px solid var(--green);
    color: var(--green);
    padding: 10px 18px;
    border-radius: 30px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.15em;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), 0 0 16px rgba(61, 220, 132, 0.25);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    user-select: none;
  }
  .floating-mode-btn:hover {
    background: var(--green);
    color: #000;
    box-shadow: 0 10px 36px rgba(0, 0, 0, 0.8), 0 0 24px rgba(61, 220, 132, 0.6);
    transform: translateY(-2px) scale(1.03);
  }
  .floating-mode-btn .f-icon {
    font-size: 16px;
  }
  .floating-mode-btn.in-barehands {
    display: flex;
    border-color: var(--cyan);
    color: var(--cyan);
    background: rgba(6, 18, 24, 0.9);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.35);
  }
  .floating-mode-btn.in-barehands:hover {
    background: var(--cyan);
    color: #000;
    box-shadow: 0 10px 36px rgba(0, 0, 0, 0.8), 0 0 28px rgba(0, 240, 255, 0.7);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span id="header-name">JARVIS</span>
    <div class="status-pill">
      <div class="status-dot"></div>
      <span id="header-status">OLLAMA LOCAL</span>
    </div>
  </div>

  <div class="header-controls">
    <select id="model-select" class="select-box" title="Select Local Ollama Model">
      <option value="qwen2.5-coder:14b">qwen2.5-coder:14b</option>
    </select>

    <select id="face-select" class="select-box" title="Switch 3D Visualizer Face">
      <option value="board">Face: Circuit Board</option>
      <option value="neural">Face: Neural Core</option>
      <option value="radial">Face: Radial Orb</option>
      <option value="rain">Face: Matrix Code</option>
    </select>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showTab('dashboard')">TERMINAL & FACE</button>
      <button class="tab-btn" onclick="showTab('vault')">MEMORY VAULT</button>
      <button class="tab-btn" onclick="showTab('settings')">SETTINGS</button>
      <button class="tab-btn" id="nav-mode-btn" onclick="toggleBareHandsMode()" style="border-color:rgba(61,220,132,0.4); color:#8ff0e4;" title="Toggle Bare Hands Hologram Mode (Alt+H / F9)">🖐️ AIR BOARD MODE</button>
    </div>
  </div>
</header>

<main>
  <!-- VIEW 4: BARE HANDS AIR BOARD (HOLOGRAPHIC STAGE) -->
  <div id="view-barehands">
    <iframe id="barehands-frame" class="barehands-frame" src="/stage.html" allow="camera; microphone; display-capture; autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <!-- VIEW 1: DASHBOARD (VISUALIZER + CHAT) -->
  <div id="view-dashboard">
    <div class="face-pane">
      <iframe id="face-frame" class="face-frame" src="faces/board/index.html"></iframe>
      <div class="face-overlay" id="face-overlay-text">
        STATE: <b id="face-state-label">IDLE</b> | <span id="talk-instruction">HOLD <b id="talk-key-label">RIGHT ALT</b> TO TALK</span>
      </div>
    </div>

    <div class="chat-pane">
      <div class="chat-header">
        <span>INTERACTIVE AGENT TERMINAL</span>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="chat-clear-btn" id="voice-out-btn" onclick="toggleTts()" title="Toggle Voice Audio Output">🔊 VOICE: ON</button>
          <button class="chat-clear-btn" onclick="clearChat()">CLEAR</button>
        </div>
      </div>

      <div class="chat-messages" id="chat-stream">
        <div class="msg assistant">
          <div class="speaker">JARVIS</div>
          Hello! I am your local AI agent. I have full access to your memory vault and local tools. How can I assist you today?
        </div>
      </div>

      <div class="chat-input-box">
        <textarea id="user-input" placeholder="Type a message or command (Enter to send, Shift+Enter for newline)..." rows="1"></textarea>
        <button class="btn ptt-btn" id="ptt-hold-btn" title="Hold down to speak (Mouse or Keyboard)">🎙️ HOLD TO TALK</button>
        <button class="btn mic-btn" id="mic-toggle-btn" title="Click to Toggle Mic" onclick="toggleWebMic()">MIC</button>
        <button class="btn" id="send-btn" onclick="sendMessage()">SEND</button>
      </div>
    </div>
  </div>

  <!-- VIEW 2: MEMORY VAULT -->
  <div id="view-vault">
    <div class="vault-layout">
      <div class="vault-sidebar" id="vault-file-list">
        <!-- Loaded dynamically -->
      </div>
      <div class="vault-editor">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="color:var(--green); font-size:13px; letter-spacing:0.15em;" id="active-note-title">NOTE: SOUL.md</span>
          <button class="btn" onclick="saveActiveNote()">SAVE NOTE</button>
        </div>
        <textarea id="vault-text" placeholder="Note content..."></textarea>
      </div>
    </div>
  </div>

  <!-- VIEW 3: SETTINGS -->
  <div id="view-settings">
    <div class="settings-card">
      <div class="settings-title">AGENT CONFIGURATION</div>
      <div class="form-group">
        <label class="form-label">AGENT NAME</label>
        <input type="text" class="form-input" id="cfg-name" value="JARVIS">
      </div>
      <div class="form-group">
        <label class="form-label">OLLAMA BASE URL</label>
        <input type="text" class="form-input" id="cfg-ollama-url" value="http://127.0.0.1:11434">
      </div>
      <div class="form-group">
        <label class="form-label">DEFAULT MODEL</label>
        <select class="form-input select-box" id="cfg-model-select"></select>
      </div>
      <div class="form-group">
        <label class="form-label">TOOL PERMISSION MODE</label>
        <select class="form-input select-box" id="cfg-perm-mode">
          <option value="ask">Ask for confirmation before file edits & commands</option>
          <option value="bypassPermissions">Auto-approve all tool actions</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">MICROPHONE / VOICE MODE</label>
        <select class="form-input select-box" id="cfg-mic-mode" onchange="onMicModeChange()">
          <option value="ptt">Push-to-Talk (Hold key to speak)</option>
          <option value="open">Hands-Free (Always listening / Open Mic)</option>
        </select>
      </div>
      <div class="form-group" id="cfg-ptt-key-group">
        <label class="form-label">PUSH-TO-TALK KEY</label>
        <select class="form-input select-box" id="cfg-ptt-key">
          <option value="right_alt">Right Alt / AltGr (Recommended for Laptops)</option>
          <option value="space">Spacebar (Hold to Talk)</option>
          <option value="right_ctrl">Right Ctrl (Bottom-right)</option>
          <option value="right_shift">Right Shift</option>
          <option value="`">Backtick ( ` ) [Below Esc]</option>
          <option value="\">Backslash ( \ )</option>
          <option value="home">Home Key</option>
          <option value="end">End Key</option>
          <option value="f8">F8 Key</option>
          <option value="f12">F12 Key</option>
        </select>
      </div>
      <button class="btn" onclick="saveSettings()">SAVE SETTINGS</button>
    </div>
  </div>
</main>

<script>
"use strict";

let activeNote = "SOUL.md";

// 1. Initialize Tabs, Modes & Config
let currentMode = "desktop"; // "desktop" | "barehands"

function toggleBareHandsMode() {
  if (currentMode === "desktop") {
    setMode("barehands");
  } else {
    setMode("desktop");
  }
}

function setMode(mode) {
  currentMode = mode;
  const barehandsView = document.getElementById("view-barehands");
  const dashView = document.getElementById("view-dashboard");
  const vaultView = document.getElementById("view-vault");
  const settingsView = document.getElementById("view-settings");
  const navBtn = document.getElementById("nav-mode-btn");
  const iframe = document.getElementById("barehands-frame");

  if (mode === "barehands") {
    // Hide desktop views
    if (dashView) dashView.style.display = "none";
    if (vaultView) vaultView.style.display = "none";
    if (settingsView) settingsView.style.display = "none";
    document.querySelectorAll(".nav-tabs .tab-btn").forEach(b => {
      if (b.id !== "nav-mode-btn") b.classList.remove("active");
    });

    // Show barehands
    if (barehandsView) barehandsView.style.display = "flex";
    if (navBtn) navBtn.classList.add("active");

    // Wake up camera in barehands iframe
    if (iframe && iframe.contentWindow) {
      try { iframe.contentWindow.postMessage("camera-resume", "*"); } catch (e) {}
    }
  } else {
    // Return to desktop
    if (barehandsView) barehandsView.style.display = "none";
    if (navBtn) navBtn.classList.remove("active");

    // Put camera to sleep in barehands iframe
    if (iframe && iframe.contentWindow) {
      try { iframe.contentWindow.postMessage("camera-pause", "*"); } catch (e) {}
    }

    // Default to dashboard tab
    showTab("dashboard");
  }
}

function showTab(tab) {
  if (currentMode === "barehands") {
    const iframe = document.getElementById("barehands-frame");
    if (iframe && iframe.contentWindow) {
      try { iframe.contentWindow.postMessage("camera-pause", "*"); } catch (e) {}
    }
    const barehandsView = document.getElementById("view-barehands");
    if (barehandsView) barehandsView.style.display = "none";
    const navBtn = document.getElementById("nav-mode-btn");
    if (navBtn) navBtn.classList.remove("active");
    currentMode = "desktop";
  }

  document.querySelectorAll(".tab-btn").forEach(b => {
    if (b.id !== "nav-mode-btn") b.classList.remove("active");
  });
  document.querySelectorAll("#view-dashboard, #view-vault, #view-settings").forEach(v => v.style.display = "none");

  if (tab === "dashboard") {
    document.getElementById("view-dashboard").style.display = "flex";
    document.querySelectorAll(".tab-btn")[0].classList.add("active");
  } else if (tab === "vault") {
    document.getElementById("view-vault").style.display = "block";
    document.querySelectorAll(".tab-btn")[1].classList.add("active");
    loadVaultNotes();
  } else if (tab === "settings") {
    document.getElementById("view-settings").style.display = "block";
    document.querySelectorAll(".tab-btn")[2].classList.add("active");
    loadSettings();
  }
}

// 2. Fetch Models and Config
async function initApp() {
  try {
    const cfgRes = await fetch("/config");
    const cfg = await cfgRes.json();
    if (cfg.name) {
      document.getElementById("header-name").textContent = cfg.name.toUpperCase();
      document.getElementById("cfg-name").value = cfg.name;
    }
    if (cfg.face) {
      document.getElementById("face-select").value = cfg.face;
      document.getElementById("face-frame").src = `faces/${cfg.face}/index.html`;
    }

    const modRes = await fetch("/api/models");
    const modData = await modRes.json();
    const modelSelect = document.getElementById("model-select");
    const cfgModelSelect = document.getElementById("cfg-model-select");
    modelSelect.innerHTML = "";
    cfgModelSelect.innerHTML = "";

    (modData.models || ["qwen2.5-coder:14b"]).forEach(m => {
      const opt1 = new Option(m, m, false, m === modData.current);
      const opt2 = new Option(m, m, false, m === modData.current);
      modelSelect.add(opt1);
      cfgModelSelect.add(opt2);
    });
    updateTalkKeyDisplay(cfg.mic_mode || "ptt", cfg.ptt_key || "right_alt");
  } catch (e) {
    console.error("Error loading config:", e);
  }
}

function formatKeyName(key) {
  const map = {
    "right_alt": "RIGHT ALT",
    "right_ctrl": "RIGHT CTRL",
    "right_shift": "RIGHT SHIFT",
    "`": "BACKTICK (` )",
    "\\": "BACKSLASH ( \\ )",
    "home": "HOME",
    "end": "END",
    "f8": "F8",
    "f12": "F12"
  };
  return map[key] || (key || "").replace("_", " ").toUpperCase();
}

// 3. Chat System & Streaming
const chatStream = document.getElementById("chat-stream");

let ttsEnabled = true;
let synthVoices = [];

function initVoices() {
  if ('speechSynthesis' in window) {
    synthVoices = window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => {
      synthVoices = window.speechSynthesis.getVoices();
    };
  }
}
initVoices();

function toggleTts() {
  ttsEnabled = !ttsEnabled;
  const btn = document.getElementById("voice-out-btn");
  if (btn) {
    btn.textContent = ttsEnabled ? "🔊 VOICE: ON" : "🔇 VOICE: OFF";
    btn.style.color = ttsEnabled ? "var(--green)" : "var(--dim)";
  }
  if (!ttsEnabled) stopSpeaking();
}

function speakSentence(text) {
  if (!ttsEnabled || !('speechSynthesis' in window)) return;
  const clean = text.replace(/[*#`_~]/g, '').replace(/<[^>]*>/g, '').trim();
  if (!clean || clean.length < 2) return;
  try {
    const u = new SpeechSynthesisUtterance(clean);
    u.rate = 1.05;
    u.pitch = 1.0;
    if (!synthVoices.length) synthVoices = window.speechSynthesis.getVoices();
    const voice = synthVoices.find(v => (v.name.includes("Natural") || v.name.includes("David") || v.name.includes("George") || v.name.includes("Guy") || v.name.includes("Mark")) && v.lang.startsWith("en")) 
               || synthVoices.find(v => v.lang.startsWith("en"));
    if (voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  } catch (e) {
    console.warn("TTS Error:", e);
  }
}

function stopSpeaking() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = "";
  stopSpeaking();

  // Append user message
  const userDiv = document.createElement("div");
  userDiv.className = "msg user";
  userDiv.innerHTML = `<div class="speaker">YOU</div>${escapeHtml(text)}`;
  chatStream.appendChild(userDiv);
  chatStream.scrollTop = chatStream.scrollHeight;

  // Prepare assistant bubble
  const asstDiv = document.createElement("div");
  asstDiv.className = "msg assistant";
  const name = document.getElementById("header-name").textContent;
  asstDiv.innerHTML = `<div class="speaker">${name}</div><span class="content"></span>`;
  chatStream.appendChild(asstDiv);
  const contentSpan = asstDiv.querySelector(".content");

  const model = document.getElementById("model-select").value;
  let sentenceBuf = "";
  const sentenceRe = /(?<=[.!?\n])\s+/;

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: text, model: model })
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.substring(6));

        if (ev.type === "delta") {
          contentSpan.textContent += ev.content;
          chatStream.scrollTop = chatStream.scrollHeight;
          sentenceBuf += ev.content;
          while (true) {
            const m = sentenceBuf.match(sentenceRe);
            if (!m) break;
            const s = sentenceBuf.slice(0, m.index + m[0].length).trim();
            sentenceBuf = sentenceBuf.slice(m.index + m[0].length);
            if (s) speakSentence(s);
          }
        } else if (ev.type === "tool_start") {
          const tCard = document.createElement("div");
          tCard.className = "tool-card";
          tCard.innerHTML = `<div class="t-head">⚙️ EXECUTING: ${ev.tool}</div><div class="t-body">${JSON.stringify(ev.args, null, 2)}</div>`;
          chatStream.insertBefore(tCard, asstDiv);
          chatStream.scrollTop = chatStream.scrollHeight;
        } else if (ev.type === "tool_end") {
          const tCard = document.createElement("div");
          tCard.className = "tool-card";
          tCard.innerHTML = `<div class="t-head">✓ OUTPUT: ${ev.tool}</div><div class="t-body">${escapeHtml(ev.output)}</div>`;
          chatStream.insertBefore(tCard, asstDiv);
          chatStream.scrollTop = chatStream.scrollHeight;
        }
      }
    }
    if (sentenceBuf.trim()) {
      speakSentence(sentenceBuf.trim());
    }
  } catch (e) {
    contentSpan.textContent += `\n[Error: ${e.message}]`;
  }
}

// 6. Voice Input (Web Audio API PCM Capture + Whisper STT)
let isRecording = false;
let isPttHeld = false;
let audioCtx = null;
let micStream = null;
let pcmProcessor = null;
let pcmBuffers = [];

function matchesBrowserKey(e, pttKey) {
  const code = (e.code || "").toLowerCase();
  const key = (e.key || "").toLowerCase();
  const target = (pttKey || "right_alt").toLowerCase();

  if (target === "right_alt" || target === "alt_r" || target === "altgr") {
    return code === "altright" || key === "altgraph" || (e.altKey && e.location === 2) || (key === "alt" && e.location === 2);
  }
  if (target === "space" || target === "spacebar") {
    return code === "space" || key === " " || key === "spacebar" || e.keyCode === 32;
  }
  if (target === "left_alt" || target === "alt_l" || target === "alt") {
    return code === "altleft" || (e.altKey && (e.location === 1 || e.location === 0)) || key === "alt";
  }
  if (target === "right_ctrl" || target === "ctrl_r") {
    return code === "controlright" || (e.ctrlKey && e.location === 2);
  }
  if (target === "left_ctrl" || target === "ctrl_l" || target === "ctrl") {
    return code === "controlleft" || (e.ctrlKey && e.location === 1);
  }
  if (target === "right_shift" || target === "shift_r") {
    return code === "shiftright" || (e.shiftKey && e.location === 2);
  }
  if (target === "left_shift" || target === "shift_l" || target === "shift") {
    return code === "shiftleft" || (e.shiftKey && e.location === 1);
  }
  if (target === "`" || target === "backtick") {
    return code === "backquote" || key === "`";
  }
  if (target === "\\" || target === "backslash") {
    return code === "backslash" || key === "\\";
  }
  if (target === "home") return code === "home" || key === "home";
  if (target === "end") return code === "end" || key === "end";
  if (target.startsWith("f")) return key === target || code === target;
  return key === target || code === target;
}

function exportWavBlob(buffers, sampleRate) {
  let length = 0;
  for (let i = 0; i < buffers.length; i++) {
    length += buffers[i].length;
  }
  const merged = new Float32Array(length);
  let offset = 0;
  for (let i = 0; i < buffers.length; i++) {
    merged.set(buffers[i], offset);
    offset += buffers[i].length;
  }
  
  const wavBuffer = new ArrayBuffer(44 + length * 2);
  const view = new DataView(wavBuffer);
  
  function writeString(view, offset, string) {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  }
  
  writeString(view, 0, 'RIFF');
  view.setUint32(4, 36 + length * 2, true);
  writeString(view, 8, 'WAVE');
  writeString(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, 1, true); // Mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(view, 36, 'data');
  view.setUint32(40, length * 2, true);
  
  let index = 44;
  for (let i = 0; i < length; i++) {
    let s = Math.max(-1, Math.min(1, merged[i]));
    view.setInt16(index, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    index += 2;
  }
  return new Blob([view], { type: 'audio/wav' });
}

async function startWebRecording() {
  const micBtn = document.getElementById("mic-toggle-btn");
  const pttBtn = document.getElementById("ptt-hold-btn");
  if (micBtn) micBtn.classList.add("active");
  if (pttBtn) pttBtn.classList.add("active");
  document.getElementById("face-state-label").textContent = "LISTENING";
  document.getElementById("face-state-label").style.color = "var(--cyan)";

  fetch("/api/state", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ state: "listening" })
  }).catch(() => {});

  try {
    if (!navigator.mediaDevices && !navigator.getUserMedia && !navigator.webkitGetUserMedia) {
      alert("MediaDevices API is restricted on this URL.\n\nPlease open: http://localhost:8790/ in Chrome/Edge.");
      stopWebRecording();
      return;
    }

    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    }
    if (audioCtx.state === "suspended") {
      await audioCtx.resume();
    }
    pcmBuffers = [];

    const getMedia = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
      ? (c) => navigator.mediaDevices.getUserMedia(c)
      : (c) => new Promise((res, rej) => (navigator.getUserMedia || navigator.webkitGetUserMedia).call(navigator, c, res, rej));

    micStream = await getMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    const source = audioCtx.createMediaStreamSource(micStream);
    pcmProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
    pcmProcessor.onaudioprocess = (e) => {
      if (!isPttHeld && !isRecording) return;
      const input = e.inputBuffer.getChannelData(0);
      pcmBuffers.push(new Float32Array(input));
    };

    source.connect(pcmProcessor);
    pcmProcessor.connect(audioCtx.destination);
  } catch (err) {
    console.error("Microphone capture error:", err);
    if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
      alert("Microphone is currently BLOCKED by your browser.\n\nTo unblock:\n1. Look at the Tune/Lock icon on the left of your address bar (next to http://localhost:8790)\n2. Click it and toggle Microphone to ALLOW\n3. Refresh this page.");
    } else if (err.name === "NotFoundError" || err.name === "DevicesNotFoundError") {
      alert("No microphone device was detected.\n\nPlease check Windows Settings > System > Sound to verify your laptop microphone is enabled.");
    } else {
      alert("Microphone error: " + err.message + "\n\nPlease open http://localhost:8790/ and allow microphone access.");
    }
    stopWebRecording();
  }
}

async function stopWebRecording() {
  const micBtn = document.getElementById("mic-toggle-btn");
  const pttBtn = document.getElementById("ptt-hold-btn");
  if (micBtn) micBtn.classList.remove("active");
  if (pttBtn) pttBtn.classList.remove("active");

  if (pcmProcessor) {
    try { pcmProcessor.disconnect(); } catch(e) {}
    pcmProcessor = null;
  }
  if (micStream) {
    try { micStream.getTracks().forEach(t => t.stop()); } catch(e) {}
    micStream = null;
  }

  if (pcmBuffers.length === 0) {
    document.getElementById("face-state-label").textContent = "IDLE";
    document.getElementById("face-state-label").style.color = "var(--green)";
    fetch("/api/state", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ state: "idle" })
    }).catch(() => {});
    return;
  }

  document.getElementById("face-state-label").textContent = "THINKING";
  document.getElementById("face-state-label").style.color = "#bd93f9";

  fetch("/api/state", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ state: "thinking" })
  }).catch(() => {});

  const currentRate = (audioCtx && audioCtx.sampleRate) || 16000;
  const wavBlob = exportWavBlob(pcmBuffers, currentRate);
  pcmBuffers = [];

  try {
    const res = await fetch("/api/transcribe", {
      method: "POST",
      body: wavBlob,
      headers: { "Content-Type": "audio/wav" }
    });
    const data = await res.json();
    if (data.text && data.text.trim()) {
      userInput.value = data.text.trim();
      sendMessage();
    } else {
      document.getElementById("face-state-label").textContent = "IDLE";
      document.getElementById("face-state-label").style.color = "var(--green)";
      fetch("/api/state", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ state: "idle" })
      }).catch(() => {});
    }
  } catch (err) {
    console.error("Transcription error:", err);
    document.getElementById("face-state-label").textContent = "IDLE";
    document.getElementById("face-state-label").style.color = "var(--green)";
    fetch("/api/state", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ state: "idle" })
    }).catch(() => {});
  }
}

function toggleWebMic() {
  if (isRecording) {
    isRecording = false;
    stopWebRecording();
  } else {
    isRecording = true;
    startWebRecording();
  }
}

function initPttButton() {
  const pttBtn = document.getElementById("ptt-hold-btn");
  if (!pttBtn) return;
  const down = (e) => {
    e.preventDefault();
    if (!isPttHeld) {
      isPttHeld = true;
      startWebRecording();
    }
  };
  const up = (e) => {
    e.preventDefault();
    if (isPttHeld) {
      isPttHeld = false;
      stopWebRecording();
    }
  };
  pttBtn.addEventListener("mousedown", down);
  pttBtn.addEventListener("mouseup", up);
  pttBtn.addEventListener("mouseleave", up);
  pttBtn.addEventListener("touchstart", down, {passive: false});
  pttBtn.addEventListener("touchend", up, {passive: false});
}

// Listen for messages from inside barehands iframe (e.g. exit button clicked or stage loaded)
window.addEventListener("message", (e) => {
  if (e.data === "exit-barehands" || e.data === "toggle-mode") {
    toggleBareHandsMode();
  } else if (e.data === "stage-ready") {
    const iframe = document.getElementById("barehands-frame");
    if (iframe && iframe.contentWindow) {
      if (currentMode === "barehands") {
        try { iframe.contentWindow.postMessage("camera-resume", "*"); } catch (err) {}
      } else {
        try { iframe.contentWindow.postMessage("camera-pause", "*"); } catch (err) {}
      }
    }
  }
});

window.addEventListener("keydown", (e) => {
  if ((e.altKey && (e.key === "h" || e.key === "H")) || e.key === "F9") {
    e.preventDefault();
    toggleBareHandsMode();
    return;
  }
  const activeKey = document.getElementById("cfg-ptt-key") ? document.getElementById("cfg-ptt-key").value : "right_alt";
  if (document.activeElement === userInput && activeKey !== "right_alt" && activeKey !== "space") {
    return;
  }
  if (matchesBrowserKey(e, activeKey)) {
    e.preventDefault();
    if (!isPttHeld) {
      isPttHeld = true;
      startWebRecording();
    }
  }
});

window.addEventListener("keyup", (e) => {
  const activeKey = document.getElementById("cfg-ptt-key") ? document.getElementById("cfg-ptt-key").value : "right_alt";
  if (matchesBrowserKey(e, activeKey)) {
    e.preventDefault();
    if (isPttHeld) {
      isPttHeld = false;
      stopWebRecording();
    }
  }
});

window.addEventListener("DOMContentLoaded", () => {
  initApp();
  initPttButton();
});
